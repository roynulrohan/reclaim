spring.application.name=reclaim

# Local settings and secrets live in backend/.env (copy .env.example to get started).
# In deployment, set the same names as real environment variables instead.
spring.config.import=optional:file:.env[.properties]

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema (src/main/resources/db/migration).
# Hibernate only checks that the entities match the tables and never changes them.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Errors are returned as JSON: { "status": 401, "detail": "..." }
spring.mvc.problemdetails.enabled=true

# Authentication
app.jwt.secret=${JWT_SECRET}
app.jwt.expiry=8h
# Only used to create the first admin when the users table is empty.
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}

# Frontend addresses allowed to call the API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
